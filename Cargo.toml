[package]
name = "superfile"
version = "0.1.0"
edition = "2021"
description = "A file manager for your terminal, written in Rust (reimplementation of superfile)"
license = "MIT"

[[bin]]
name = "spf"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
dirs = "6"
humansize = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
unicode-width = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
md-5 = "0.10"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
arboard = "3"
ureq = { version = "3", features = ["json"] }

[profile.release]
lto = true
strip = true
